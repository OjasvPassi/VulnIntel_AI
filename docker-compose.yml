services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://vulnintel:vulnpass@db:5432/vulnintel
      - ENV=development
    depends_on:
      - db
  db:
    image: postgres:15
    container_name: vulnintel-db-1
    environment:
      POSTGRES_USER: vulnintel
      POSTGRES_PASSWORD: vulnpass
      POSTGRES_DB: vulnintel
    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
